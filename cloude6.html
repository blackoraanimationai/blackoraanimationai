<style>
:root{--bg:#0d0f14;--panel:#161a22;--panel2:#1d222c;--line:#2a3040;--text:#e8ebf2;--mute:#8b93a7;--acc:#7c5cff;--acc2:#22d3ee;--ok:#22c55e;--bad:#ef4444}
body.light{--bg:#f3f5fa;--panel:#fff;--panel2:#eef1f7;--line:#d9deea;--text:#1a1e29;--mute:#667088}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;font-weight:600}
button.sm{padding:5px 9px;font-size:12px;border-radius:8px}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}

#app{display:flex;height:100%}
#side{width:200px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 8px;gap:2px;overflow:auto;flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;padding:6px 10px 14px}.logo span{background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}.sb-logo{width:30px;height:30px;flex-shrink:0}
.nav{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;color:var(--mute);border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-left:3px solid var(--acc)}
.sp{flex:1}
#main{flex:1;overflow:auto;min-width:0}
.top{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
.top h2{font-size:18px;flex:1}
.wrap{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;position:relative}
.card .em{font-size:44px;line-height:1.3}
.thimg{width:64px;height:64px;object-fit:contain;border-radius:8px}
.card .nm{font-size:12px;color:var(--mute);margin:4px 0 8px}
.card .row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.fav{position:absolute;top:6px;right:8px;cursor:pointer;font-size:16px;opacity:.5}
.fav.on{opacity:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.chip{white-space:nowrap;padding:6px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--mute)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 12px;text-align:center;cursor:pointer}
.tile:hover{border-color:var(--acc);transform:translateY(-2px)}
.tile .em{font-size:34px}
.tile b{display:block;margin-top:6px}
h3{margin:18px 0 10px;font-size:15px}
.hero{background:linear-gradient(135deg,#3b2a8f,#0e7490);border-radius:18px;padding:22px;margin-bottom:8px}
.hero h1{font-size:22px;margin-bottom:6px;color:#fff}
.hero p{color:#dbeafe;margin-bottom:14px}
.list .it{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;flex-wrap:wrap}
.list .it .t{flex:1;min-width:100px}
.list .it small{color:var(--mute)}
#editor{display:none;flex-direction:column;height:100%}
#editor.show{display:flex}
.etop{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}
.etop button,.etop .seg{flex-shrink:0}
.etop input{width:130px;padding:6px 8px;flex-shrink:0}
.ebody{flex:1;display:flex;min-height:0;position:relative}
.tools{width:64px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;flex-shrink:0}
.tools button{border:0;border-radius:0;background:none;padding:10px 2px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
.tools button span{font-size:20px}
.tools button.on{color:var(--text);background:var(--panel2);border-left:3px solid var(--acc)}
.drawer{width:230px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px;flex-shrink:0}
.drawer .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.drawer .mini div{background:var(--panel2);border-radius:10px;padding:8px 2px;text-align:center;cursor:pointer;font-size:26px}
.drawer .mini div:hover{outline:2px solid var(--acc)}
.drawer .mini div small{display:block;font-size:9px;color:var(--mute)}
.center{flex:1;display:flex;flex-direction:column;min-width:0}
.stagewrap{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-height:0;background:var(--bg)}
#stage{position:relative;overflow:hidden;background:#87ceeb;border-radius:8px;box-shadow:0 8px 30px #0008;max-width:100%;max-height:100%}
.el{position:absolute;cursor:move;user-select:none;touch-action:none;line-height:1;white-space:nowrap}
.el img{pointer-events:none;display:block}
.el.sel{outline:2px dashed var(--acc2);outline-offset:4px}
.layers{width:190px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px;flex-shrink:0}
.layer{display:flex;align-items:center;gap:4px;padding:6px;border-radius:8px;cursor:pointer;font-size:12px}
.layer.on{background:var(--panel2)}
.layer .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer i{font-style:normal;opacity:.7;cursor:pointer}
.tl{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px}
.tlrow{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.scenes{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.sc{min-width:90px;height:50px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:#fff;flex-direction:column;flex-shrink:0}
.sc.on{border-color:var(--acc2)}
.prop{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.prop label{font-size:11px;color:var(--mute);width:100%}
.prop input[type=range]{padding:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal.show{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.mbox h3{margin-top:0}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.rcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.rc{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer}
.rc:hover{border-color:var(--acc)}
.rc .box{margin:0 auto 8px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:6px}
.rc small{display:block;color:var(--mute);font-size:10px;margin-top:2px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:10px 16px;border-radius:99px;display:none;z-index:120;max-width:90%;text-align:center}
#login{position:fixed;inset:0;z-index:80;overflow:auto;color:#f2f4fa;background:radial-gradient(900px 600px at 25% 45%,rgba(91,115,255,.22),transparent 60%),radial-gradient(600px 400px at 85% 95%,rgba(255,224,27,.07),transparent 60%),#090b12}
#login.off{background:radial-gradient(900px 600px at 25% 45%,rgba(91,115,255,.08),transparent 60%),#04050a}
#fireflies{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.firefly{position:absolute;left:0;top:0;border-radius:50%;background:#ffe14d;box-shadow:0 0 8px 3px rgba(255,225,77,.7);opacity:.15;animation:ffMove var(--dur) linear var(--delay) infinite,ffGlow 3.2s ease-in-out var(--delay) infinite}
@keyframes ffMove{0%,100%{transform:translate(var(--x1),var(--y1))}20%{transform:translate(var(--x2),var(--y2))}40%{transform:translate(var(--x3),var(--y3))}60%{transform:translate(var(--x4),var(--y4))}80%{transform:translate(var(--x5),var(--y5))}}
@keyframes ffGlow{0%,100%{opacity:.12}50%{opacity:.95}}
.lg-wrap{position:relative;z-index:1;min-height:100%;max-width:1000px;margin:0 auto;padding:24px;display:flex;align-items:center;justify-content:center;gap:48px}
.lg-scene{width:360px;height:420px;flex-shrink:0}
.lg-scene svg{width:100%;height:100%;overflow:visible;display:block}
.lit,.bulb,.chr{transition:opacity .5s}
#login.off .lit{opacity:0}
#login.off .bulb{opacity:.12}
#login.off .chr{opacity:.4}
.cone{animation:flick 4s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.86}}
.cord{cursor:pointer;transition:transform .2s;transform-box:fill-box}
.cord.pull{transform:translateY(9px)}
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}

.fi:focus-within{border-color:#ffe01b;color:#ffe01b;box-shadow:0 0 0 3px rgba(255,224,27,.12)}
.fi svg{flex-shrink:0}

.fi input:focus{border:0}

.lg-forgot{display:block;text-align:right;font-size:12px;color:#9aa2b8;cursor:pointer;margin:-2px 2px 10px}
.lg-go{width:100%;border:0;border-radius:13px;padding:14px;background:#ffe01b;color:#17181c;font-weight:800;font-size:15px;margin-top:2px;box-shadow:0 8px 24px rgba(255,224,27,.25)}
.lg-go:hover{filter:brightness(1.06)}
.lg-or{display:flex;align-items:center;gap:10px;color:#707891;font-size:11px;letter-spacing:.06em;margin:16px 0 12px}
.lg-or:before,.lg-or:after{content:'';flex:1;height:1px;background:rgba(255,255,255,.12)}
.lg-soc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lg-soc button{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 4px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;font-size:13px;color:#f2f4fa}
.lg-soc button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.lg-guest{width:100%;margin-top:12px;background:none;border:0;color:#9aa2b8;font-size:12.5px;text-decoration:underline;padding:8px}
.lg-note{font-size:11.5px;color:#d9c25a;margin-top:6px;text-align:center;line-height:1.5}
.lg-note:empty{display:none}
.lg-setup{display:block;text-align:center;font-size:11.5px;color:#707891;margin-top:6px;cursor:pointer}
@media(max-width:880px){
 .lg-wrap{flex-direction:column;gap:6px;padding:14px 14px 28px;justify-content:flex-start}
 .lg-scene{width:100%;max-width:300px;height:220px}
 .lg-card{padding:20px 18px 14px}
}
.cut{background:repeating-conic-gradient(#888 0 25%,#666 0 50%) 50%/16px 16px;border-radius:12px}
#bnav{display:none}
@media(max-width:800px){
 #side{display:none!important}
 #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:20;overflow-x:auto}
 #bnav button{flex:1;min-width:60px;border:0;border-radius:0;background:none;font-size:10px;color:var(--mute);display:flex;flex-direction:column;align-items:center;padding:8px 2px}
 #bnav button span{font-size:20px}
 #bnav button.on{color:var(--acc2)}
 #main{padding-bottom:62px}
 .drawer{display:none;position:absolute;left:64px;bottom:0;height:46%;width:calc(100% - 64px);z-index:10;border-top:2px solid var(--acc)}
 .drawer.open{display:block}
 .layers{display:none;position:absolute;right:0;top:0;bottom:0;width:72%;z-index:12;border-left:2px solid var(--acc)}
 .layers.open{display:block}
 .grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}
 .tiles{grid-template-columns:repeat(2,1fr)}
}
</style>

function fbParseCfg(raw){
 const m=String(raw).match(/\{[\s\S]*\}/);if(!m)return null;
 const txt=m[0].replace(/^\s*\/\/.*$/gm,'').replace(/'/g,'"').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/,\s*}/g,'}');
 try{const c=JSON.parse(txt);return(c.apiKey&&c.authDomain&&c.projectId)?c:null}catch(e){return null}
}

 const raw=$('#fbcfg').value;
 if(/private_key|service_account|client_x509_cert_url|firebase-adminsdk/.test(raw)){$('#fbcfg').value='';toast('⚠️ यह गलत फ़ाइल है (प्राइवेट चाबी)। इसे कहीं मत चिपकाओ — "Web app" वाली firebaseConfig चाहिए');return}
 const c=fbParseCfg(raw);
 if(!c){toast('config पढ़ नहीं पाया — { से } तक पूरा चिपकाओ');return}
 localStorage.setItem('blackora_fb',JSON.stringify(c));closeModal();toast('✅ config सेव हो गई');
}

 const M={'auth/configuration-not-found':'Firebase में Authentication अभी चालू नहीं है — Build → Authentication → "Get started" दबाओ','auth/api-key-not-valid.-please-pass-a-valid-api-key.':'config की apiKey गलत है — दोबारा सही config डालो','auth/invalid-api-key':'config की apiKey गलत है — दोबारा सही config डालो','auth/invalid-credential':'ईमेल या पासवर्ड गलत है','auth/wrong-password':'पासवर्ड गलत है','auth/user-not-found':'इस ईमेल का अकाउंट नहीं मिला — "नया अकाउंट" बनाओ','auth/email-already-in-use':'यह ईमेल पहले से है — लॉगिन करो','auth/weak-password':'पासवर्ड कम से कम 6 अक्षर का रखो','auth/invalid-email':'ईमेल सही नहीं है','auth/popup-closed-by-user':'लॉगिन बीच में बंद हो गया','auth/cancelled-popup-request':'लॉगिन बीच में बंद हो गया','auth/popup-blocked':'ब्राउज़र ने पॉप-अप रोक दिया — पॉप-अप की इजाज़त दो','auth/unauthorized-domain':'इस वेबसाइट को Firebase → Authentication → Settings → Authorized domains में जोड़ना है','auth/operation-not-allowed':'Firebase में यह लॉगिन तरीका अभी चालू नहीं है','auth/network-request-failed':'इंटरनेट की दिक्कत है','auth/operation-not-supported-in-this-environment':'यहाँ से लॉगिन नहीं चलेगा — इसे वेबसाइट (https) पर खोलना होगा','auth/too-many-requests':'बहुत कोशिशें हो गईं — थोड़ी देर बाद करो','auth/invalid-phone-number':'फ़ोन नंबर सही नहीं है (+91 के साथ लिखो)','auth/invalid-verification-code':'OTP गलत है'};

const HAND={idle:[[34,186],[126,186]],shy:[[67,68],[93,68]]};
let shyT=0,shyV=0,lkX=0,lkY=0,tgX=0,tgY=0,lgFocus=null;
function look(px,py,full){
 const a=$('#eL').getBoundingClientRect(),b=$('#eR').getBoundingClientRect();
 const cx=(a.left+b.right)/2,cy=a.top+a.height/2,dx=px-cx,dy=py-cy,d=Math.hypot(dx,dy)||1,k=full?1:Math.min(1,d/250);
 tgX=dx/d*3.4*k;tgY=dy/d*3*k;
}
function lookInput(el){const r=el.getBoundingClientRect();look(r.left+Math.min(r.width-20,14+el.value.length*8),r.top+r.height/2,true)}
const CE={};
function chrLoop(){
 const L=$('#login');if(!L||L.style.display==='none')return;
 if(!CE.aL){['aL','aR','hL','hR','pL','pR'].forEach(k=>CE[k]=$('#'+k))}
 shyV+=(shyT-shyV)*.16;lkX+=(tgX-lkX)*.2;lkY+=(tgY-lkY)*.2;
 [['aL','hL','pL',0],['aR','hR','pR',1]].forEach(([a,h,p,i])=>{
  const I=HAND.idle[i],T=HAND.shy[i],x=I[0]+(T[0]-I[0])*shyV,y=I[1]+(T[1]-I[1])*shyV;
  CE[a].setAttribute('x2',x.toFixed(2));CE[a].setAttribute('y2',y.toFixed(2));
  CE[h].setAttribute('cx',x.toFixed(2));CE[h].setAttribute('cy',y.toFixed(2));
  CE[p].setAttribute('transform','translate('+lkX.toFixed(2)+' '+lkY.toFixed(2)+')');
 });
 requestAnimationFrame(chrLoop);
}

function loadImg(src){return new Promise(r=>{if(imgCache[src])return r(imgCache[src]);const i=new Image();i.crossOrigin='anonymous';i.onload=()=>{imgCache[src]=i;r(i)};i.onerror=()=>r(null);i.src=src})}
const imgCache={};
function cutout(im){
 try{
  const sc=Math.min(1,384/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){const m=Math.min(p[i],p[i+1],p[i+2]);if(m>238)p[i+3]=0;else if(m>215)p[i+3]=Math.round((238-m)/23*255)}
  x.putImageData(d,0,0);return c.toDataURL('image/png');
 }catch(e){return null}
}

let VOX=[];function loadVox(){try{VOX=speechSynthesis.getVoices()}catch(e){}}
loadVox();try{speechSynthesis.onvoiceschanged=loadVox}catch(e){}
function speakText(txt,lang,pitch,rate){
 try{
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=lang;u.pitch=pitch||1;u.rate=rate||1;
  const v=VOX.find(x=>x.lang===lang)||VOX.find(x=>x.lang.replace('_','-').startsWith(lang.slice(0,2)));if(v)u.voice=v;
  u.onerror=()=>toast('इस फ़ोन/ब्राउज़र में यह आवाज़ उपलब्ध नहीं है');
  speechSynthesis.speak(u);
 }catch(e){toast('इस ब्राउज़र में आवाज़ की सुविधा नहीं है')}
}
const allVoices=()=>[...VOICES,...S.myVoices];
function voiceParams(v){
 if(v.pitch!==undefined)return {lang:v.lang,pitch:v.pitch,rate:v.rate};
 return {lang:v.l==='Hindi'?'hi-IN':'en-IN',pitch:{Male:.8,Female:1.2,Child:1.7}[v.g]||1,rate:{Happy:1.1,Serious:.9,Calm:.85,Excited:1.25,Angry:1.1,Sad:.8,Cute:1.1}[v.e]||1};
}
const findVoice=id=>allVoices().find(v=>v.id===id);
const voiceName=id=>{const v=findVoice(id);return v?v.n:'कोई नहीं'};
function previewVoice(id){const v=findVoice(id);if(!v)return;const p=voiceParams(v);speakText(v.text||(p.lang==='hi-IN'?'नमस्ते, मैं '+v.n+' हूँ':'Hello, I am '+v.n),p.lang,p.pitch,p.rate)}
function speakNarr(sc){if(!sc.narr)return;const v=findVoice(P&&P.voice);const p=v?voiceParams(v):{lang:'hi-IN',pitch:1,rate:1};speakText(sc.narr,p.lang,p.pitch,p.rate)}

const RATIOS={'16:9':[16,9],'9:16':[9,16],'1:1':[1,1]};
function mkProject(tpl,ratio){
 const bg=tpl?SCENEBG[tpl]:'linear-gradient(#87ceeb 60%,#6bbf59 60%)';
 const p={id:uid(),name:'प्रोजेक्ट '+(S.projects.length+1),ratio,fps:30,res:'1080p',music:null,voice:null,t:Date.now(),scenes:[{id:uid(),bg,els:[],dur:3,name:tpl||'सीन 1'}],cur:0};
 S.projects.unshift(p);save();return p;
}
function newProject(tpl){
 const R=[['16:9','YouTube / TV',64,36],['9:16','Reels / Shorts',36,64],['1:1','Instagram',48,48]];
 modal(`<h3>📐 वीडियो का साइज़ चुनो</h3><div class="rcards">${R.map(r=>`<div class="rc" onclick="pickRatio('${tpl||''}','${r[0]}')"><div class="box" style="width:${r[2]}px;height:${r[3]}px"></div><b>${r[0]}</b><small>${r[1]}</small></div>`).join('')}</div><button onclick="closeModal()" style="width:100%">${t('Cancel')}</button>`);
}
function pickRatio(tpl,r){closeModal();P=mkProject(tpl||null,r);undoStack=[];redoStack=[];sel=null;go('editor')}
function openProject(id){P=S.projects.find(p=>p.id===id);if(!P)return;P.cur=0;sel=null;undoStack=[];redoStack=[];go('editor')}
function renameProject(id){const p=S.projects.find(x=>x.id===id),n=prompt('नया नाम',p.name);if(n){p.name=n;save();go(view)}}
function dupProject(id){const p=S.projects.find(x=>x.id===id),c=JSON.parse(JSON.stringify(p));c.id=uid();c.name=p.name+' कॉपी';S.projects.unshift(c);save();go(view)}
function delProject(id){if(!confirm('हटाना है?'))return;S.projects=S.projects.filter(p=>p.id!==id);if(P&&P.id===id)P=null;save();go(view)}
function saveTemplate(){S.myTemplates.unshift({id:uid(),name:P.name,data:JSON.stringify(P)});save();toast('✅ My Templates में सेव हो गया')}
function useTemplate(id){const x=S.myTemplates.find(a=>a.id===id);const c=JSON.parse(x.data);c.id=uid();c.name=x.name+' (नया)';c.t=Date.now();S.projects.unshift(c);save();closeModal();P=c;go('editor')}

const ETABS=[['scene','🎬','Scene'],['characters','👤','Chars'],['assets','🖼️','Assets'],['bg','🌄','BG'],['text','🔤','Text'],['voice','🎙️','Voice'],['music','🎵','Music'],['sfx','🔊','SFX'],['anim','🎞️','Anim'],['camera','📷','Camera'],['trans','🔀','Trans']];

const ANIMS=['None','bounce','float','spin','shake','pulse'],TRANS=['None','Fade'];

function renderEditor(){

  <button class="sm" onclick="startPlay()">▶ ${t('Preview')}</button><button class="pri sm" onclick="exportModal()">${t('Export')}</button>
 </div>

  <div class="tools">${ETABS.map(x=>`<button class="${etab===x[0]?'on':''}" onclick="pickTab('${x[0]}')"><span>${x[1]}</span>${t(x[2])}</button>`).join('')}</div>

function pickTab(x){if(etab===x&&mob())dOpen=!dOpen;else{etab=x;dOpen=true}renderEditor()}
function closeDrawers(){dOpen=false;const d=$('#drawer');if(d)d.classList.remove('open');const l=$('#layers');if(l)l.classList.remove('open')}
function exitEditor(){stopPlay();stopMusic();save();go('home')}
function sizeStage(){
 const st=$('#stage');if(!st)return;const [w,h]=RATIOS[P.ratio],wrap=st.parentElement;
 const mw=wrap.clientWidth-24,mh=wrap.clientHeight-24;
 let W=mw,H=W*h/w;if(H>mh){H=mh;W=H*w/h}
 st.style.width=Math.max(120,W)+'px';st.style.height=Math.max(80,H)+'px';
}
addEventListener('resize',()=>{if(view==='editor'){sizeStage();drawStage()}});
function drawerHTML(){

 case'text':return `<b>${t('Text')}</b><div class="fld" style="margin-top:8px"><input id="txin" placeholder="यहाँ लिखो"></div><button class="pri" onclick="addText()" style="width:100%">टेक्स्ट जोड़ो</button>${sel&&sel.type==='text'?`<div class="fld" style="margin-top:10px"><label>रंग</label><input type="color" value="${sel.color}" onchange="setProp('color',this.value)"></div>`:''}`;
 case'voice':return `<b>${t('Voice')}</b><div class="fld" style="margin-top:8px"><label>इस सीन में क्या बोलना है?</label><textarea rows="3" id="narr" onchange="scene().narr=this.value;save()">${esc(scene().narr||'')}</textarea></div><button class="sm" onclick="scene().narr=$('#narr').value;save();speakNarr(scene())">▶ सुनो</button><p style="color:var(--mute);font-size:12px;margin:10px 0 6px">आवाज़ चुनो (अभी: ${esc(voiceName(P.voice))})</p>${allVoices().map(v=>`<div class="layer"><span class="n">${esc(v.n)} <small style="color:var(--mute)">${v.g}</small></span><button class="sm" onclick="previewVoice('${v.id}')">▶</button><button class="sm" onclick="P.voice='${v.id}';save();renderEditor()">Use</button></div>`).join('')}`;

let AC=null,mTimer=null,musicNow=null;
const MSTYLE={
 Intense:{bpm:150,sc:[0,1,4,5,7,8],w:'sawtooth',b:45,v:.05,k:1},Mystical:{bpm:68,sc:[0,2,3,7,9],w:'sine',b:57,v:.12,k:0},
 'Pop-Romantic':{bpm:104,sc:[0,2,4,7,9],w:'triangle',b:55,v:.12,k:1},Bright:{bpm:124,sc:[0,2,4,5,7,9,11],w:'square',b:60,v:.04,k:1},
 Romance:{bpm:76,sc:[0,2,4,7,9],w:'sine',b:55,v:.13,k:0},Lullaby:{bpm:60,sc:[0,2,4,7],w:'sine',b:64,v:.13,k:0},
 Mysterious:{bpm:80,sc:[0,1,3,6,7],w:'triangle',b:52,v:.12,k:0},Rhymes:{bpm:112,sc:[0,2,4,5,7,9],w:'square',b:62,v:.04,k:1},
 Suspense:{bpm:90,sc:[0,1,3,6],w:'sawtooth',b:43,v:.04,k:1},Village:{bpm:100,sc:[0,2,4,7,9],w:'triangle',b:57,v:.13,k:1},
 Horror:{bpm:55,sc:[0,1,6,7],w:'sawtooth',b:36,v:.04,k:0},New:{bpm:118,sc:[0,3,5,7,10],w:'triangle',b:57,v:.12,k:1}
};
const trackCat=x=>{for(const c in MUSIC)if(MUSIC[c].includes(x))return c;return 'Bright'};
const hashS=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
function playMusic(x){
 stopMusic();
 try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();AC.master=AC.createGain();AC.master.gain.value=.9;AC.master.connect(AC.destination)}AC.resume()}catch(e){toast('इस डिवाइस पर आवाज़ नहीं चल सकती');return}
 const st=MSTYLE[trackCat(x)];let seed=hashS(x);
 const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 const pat=Array.from({length:16},()=>rnd()<.25?-1:Math.floor(rnd()*st.sc.length));
 const beat=60/st.bpm/2,hz=m=>440*Math.pow(2,(m-69)/12);
 const note=(f,d,type,vol,when)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vol,when+.02);g.gain.exponentialRampToValueAtTime(.0001,when+d);o.connect(g);g.connect(AC.master);o.start(when);o.stop(when+d+.05)};
 let i=0,next=AC.currentTime+.06;
 const sched=()=>{
  while(next<AC.currentTime+.3){
   const s=i%16,p=pat[s];
   if(p>=0)note(hz(st.b+12+st.sc[p]),beat*1.8,st.w,st.v,next);
   if(s%4===0){note(hz(st.b-12+st.sc[s/4]),beat*3.5,'triangle',.18,next);if(st.k)note(60,.15,'sine',.3,next)}
   next+=beat;i++;
  }
 };
 sched();mTimer=setInterval(sched,60);musicNow=x;
}
function stopMusic(){clearInterval(mTimer);mTimer=null;musicNow=null}
function toggleMusic(x){
 if(musicNow===x)stopMusic();else playMusic(x);
 if(view==='music')go('music');else if(view==='editor'){const d=$('#drawer');if(d)d.innerHTML=drawerHTML()}
}
